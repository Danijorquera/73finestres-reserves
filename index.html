<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>73 Finestres - Reserves</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #1a1a1a; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .tables-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .table-btn { padding: 12px; border: 2px solid #e5e7eb; background: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .table-btn.selected { border-color: #2563eb; background: #eff6ff; color: #2563eb; }
        .table-btn.occupied { background: #f3f4f6; color: #9ca3af; border-color: #e5e7eb; cursor: not-allowed; text-decoration: line-through; }
        #message { margin-top: 20px; padding: 12px; border-radius: 8px; text-align: center; font-weight: 500; display: none; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Reservar Taula</h2>
    <form id="reservationForm">
        <div class="form-group">
            <label for="date">Data de la reserva</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="shift">Torn</label>
            <select id="shift" required>
                <option value="">Selecciona un torn...</option>
                <option value="dinar">Dinar</option>
                <option value="sopar">Sopar</option>
            </select>
        </div>

        <div class="form-group">
            <label>Selecciona una taula</label>
            <div class="tables-grid" id="tablesContainer">
                <button type="button" class="table-btn" data-table="1">Taula 1</button>
                <button type="button" class="table-btn" data-table="2">Taula 2</button>
                <button type="button" class="table-btn" data-table="3">Taula 3</button>
                <button type="button" class="table-btn" data-table="4">Taula 4</button>
                <button type="button" class="table-btn" data-table="5">Taula 5</button>
                <button type="button" class="table-btn" data-table="6">Taula 6</button>
            </div>
            <input type="hidden" id="selectedTable" required>
        </div>

        <div class="form-group">
            <label for="pax">Comensals (Persones)</label>
            <input type="number" id="pax" min="1" max="10" value="2" required>
        </div>

        <div class="form-group">
            <label for="name">Nom i Cognoms</label>
            <input type="text" id="name" placeholder="Escriu el teu nom" required>
        </div>

        <div class="form-group">
            <label for="phone">Telèfon de contacte</label>
            <input type="tel" id="phone" placeholder="600000000" required>
        </div>

        <button type="submit">Confirmar Reserva</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const API_URL = window.location.origin;
    let selectedTableId = null;
    const dateInput = document.getElementById('date');
    const shiftSelect = document.getElementById('shift');
    const tableButtons = document.querySelectorAll('.table-btn');
    const selectedTableInput = document.getElementById('selectedTable');

    dateInput.valueAsDate = new Date();

    async function checkAvailability() {
        const date = dateInput.value;
        const shift = shiftSelect.value;
        
        selectedTableId = null;
        selectedTableInput.value = '';
        tableButtons.forEach(b => {
            b.classList.remove('selected', 'occupied');
            b.disabled = false;
        });

        if (!date || !shift) return;

        try {
            const res = await fetch(`${API_URL}/api/reservations?date=${date}&shift=${shift}`);
            const occupiedTables = await res.json();

            tableButtons.forEach(btn => {
                const tableId = parseInt(btn.dataset.table);
                if (occupiedTables.includes(tableId)) {
                    btn.classList.add('occupied');
                    btn.disabled = true;
                }
            });
        } catch (err) {
            console.error("Error en consultar disponibilitat", err);
        }
    }

    dateInput.addEventListener('change', checkAvailability);
    shiftSelect.addEventListener('change', checkAvailability);

    tableButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('occupied')) return;
            tableButtons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedTableId = btn.dataset.table;
            selectedTableInput.value = selectedTableId;
        });
    });

    document.getElementById('reservationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById('message');

        if (!selectedTableId) {
            alert('Si us plau, selecciona una taula.');
            return;
        }

        const payload = {
            table_id: parseInt(selectedTableId),
            date: dateInput.value,
            shift: shiftSelect.value,
            pax: parseInt(document.getElementById('pax').value),
            customer_name: document.getElementById('name').value,
            customer_phone: document.getElementById('phone').value
        };

        try {
            const res = await fetch(`${API_URL}/api/reservations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                msgDiv.textContent = "¡Reserva realitzada amb èxit! Moltíssimes gràcies.";
                msgDiv.className = "success";
                msgDiv.style.display = "block";
                document.getElementById('reservationForm').reset();
                dateInput.valueAsDate = new Date();
                checkAvailability();
            } else {
                msgDiv.textContent = data.error || "Error al processar la reserva.";
                msgDiv.className = "error";
                msgDiv.style.display = "block";
                checkAvailability();
            }
        } catch (err) {
            msgDiv.textContent = "Error de connexió amb el servidor.";
            msgDiv.className = "error";
            msgDiv.style.display = "block";
        }
    });

    checkAvailability();
</script>

</body>
</html>
